<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#78b3d4"><meta name="description" content="A little car to take apart."><title>ifreelgood.com</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#16334a;color:#fff}body{font-family:monospace}main{width:100%;height:100%;position:relative}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#hit{position:absolute;inset:0;border:0;background:transparent;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}#hit:focus-visible{outline:2px solid #fff0b8;outline-offset:-8px}.brand{position:fixed;left:max(24px,env(safe-area-inset-left));top:max(24px,env(safe-area-inset-top));font-size:14px;letter-spacing:.03em;text-shadow:1px 2px #18334c80;pointer-events:none}#reset{position:fixed;bottom:max(28px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:14px 22px;color:#fff;background:#0b1729d9;border:1px solid #b9c6b777;font:14px monospace;cursor:pointer;min-height:48px}#reset[hidden]{display:none}#reset:focus-visible{outline:2px solid #fff0b8;outline-offset:4px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}#error{position:fixed;bottom:24px;width:100%;text-align:center;padding:20px}
</style></head><body><main><canvas id="scene" aria-hidden="true"></canvas><button id="hit" aria-label="Hit the car. Press repeatedly to break it apart." disabled></button></main><span class="brand">ifreelgood.com</span><button id="reset" hidden aria-label="Rebuild the car">↻ reset</button><p id="status" class="sr" role="status" aria-live="polite">Loading car</p><p id="error" hidden>Couldn't load the scene. Please reload.</p><script>
'use strict';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),hit=document.querySelector('#hit'),reset=document.querySelector('#reset'),status=document.querySelector('#status');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function asset(path){const im=new Image();im.src=path;return im;}
const backdrop=asset('waterfront.png');
// Frames decoded without repainting, recoloring, scaling, or compositing from
// the 14-frame original animation linked by the owner. See ASSET-SOURCES.md.
const frames=Array.from({length:14},(_,i)=>asset('car-frames/'+String(i).padStart(2,'0')+'.png'));
const FINAL=frames.length-1;
let damage=0,particles=[],shake=0,impact=null,last=0,raf=0,ready=false,W=600,H=360,carX=0,carY=0,scale=1,ground=280;
function resize(){const ratio=innerWidth/innerHeight;W=Math.max(360,Math.round(360*ratio));H=Math.round(W/ratio);canvas.width=W;canvas.height=H;scale=Math.min(1.8,W*(ratio<.9?.86:.58)/200);ground=Math.round(H*.855);carX=Math.round((W-200*scale)/2);carY=Math.round(ground-150*scale);particles=[];impact=null;if(ready)draw();}
function background(){ctx.imageSmoothingEnabled=false;const sw=Math.min(backdrop.width,backdrop.height*W/H);ctx.drawImage(backdrop,(backdrop.width-sw)/2,0,sw,backdrop.height,0,0,W,H);}
function draw(){background();ctx.save();if(shake&&!reduced.matches)ctx.translate(Math.round((Math.random()-.5)*shake),Math.round((Math.random()-.5)*shake));ctx.drawImage(frames[damage],carX,carY,200*scale,150*scale);ctx.restore();
for(const p of particles){ctx.save();ctx.translate(Math.round(p.x),Math.round(p.y));ctx.rotate(p.angle);ctx.globalAlpha=Math.min(1,p.life);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.5);ctx.restore();}
if(impact){ctx.strokeStyle='#fff3bb';ctx.lineWidth=1;for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.beginPath();ctx.moveTo(impact.x+Math.cos(a)*6,impact.y+Math.sin(a)*6);ctx.lineTo(impact.x+Math.cos(a)*impact.radius,impact.y+Math.sin(a)*impact.radius);ctx.stroke();}}}
function animate(t){const dt=Math.min((t-last)/1000,.033);last=t;shake=Math.max(0,shake-dt*45);for(const p of particles){if(!p.rest){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.angle+=p.spin*dt;if(p.y>=p.floor){p.y=p.floor;p.vy*=-.25;p.vx*=.6;if(Math.abs(p.vy)<15)p.rest=true;}}p.life-=dt*.5;}particles=particles.filter(p=>p.life>0);if(impact){impact.life-=dt;impact.radius+=dt*80;if(impact.life<=0)impact=null;}draw();if(particles.length||shake||impact)raf=requestAnimationFrame(animate);else raf=0;}
function start(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(animate);}}
function strike(e){if(!ready||damage>=FINAL)return;const r=canvas.getBoundingClientRect();let x=e.detail===0?carX+105*scale:(e.clientX-r.left)*W/r.width,y=e.detail===0?carY+85*scale:(e.clientY-r.top)*H/r.height;x=Math.max(carX+25*scale,Math.min(carX+180*scale,x));y=Math.max(carY+65*scale,Math.min(ground-25*scale,y));damage++;status.textContent=damage===FINAL?'Car destroyed. Reset to rebuild.':`Car damage: ${damage} of ${FINAL}.`;hit.setAttribute('aria-label',damage===FINAL?'Car destroyed':'Hit the car. '+(FINAL-damage)+' hits remaining.');
if(!reduced.matches){shake=damage===FINAL?4:2.5;impact={x,y,radius:10,life:.08};const glass=damage<5;for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*150,vy:-40-Math.random()*120,floor:ground-10+Math.random()*20,angle:Math.random()*6,spin:(Math.random()-.5)*10,size:2+Math.random()*3,color:glass?['#c8e8ee','#70b6d5','#ecf9fa'][i%3]:['#81918c','#b2beb3','#374450'][i%3],life:1.7,rest:false});particles=particles.slice(-120);start();}else draw();
if(damage===FINAL){reset.hidden=false;hit.disabled=true;}}
hit.addEventListener('click',strike);reset.addEventListener('click',()=>{if(raf)cancelAnimationFrame(raf);raf=0;damage=0;particles=[];shake=0;impact=null;reset.hidden=true;hit.disabled=false;status.textContent='Car rebuilt.';hit.setAttribute('aria-label','Hit the car. Press repeatedly to break it apart.');draw();hit.focus({preventScroll:true});});
window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden&&raf){cancelAnimationFrame(raf);raf=0;}else if(ready)start();});
Promise.all([backdrop,...frames].map(im=>im.decode())).then(()=>{ready=true;resize();hit.disabled=false;status.textContent='Car ready. Press to break it apart.';}).catch(()=>{document.querySelector('#error').hidden=false;status.textContent='Scene failed to load.';});resize();
</script></body></html>
